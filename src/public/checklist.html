<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Checklist</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <style>
            /* mimic main container chrome, but without transparency */
            html, body { background:#0f1113; }
            .cl-container { display:flex; flex-direction:column; height:100vh; box-sizing:border-box; border-radius:4px; overflow:hidden; background: #303335; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 30px rgba(0,0,0,0.2); }
            .cl-controls { -webkit-app-region: drag; display:flex; align-items:center; justify-content: space-between; padding:6px 10px; background:#121517; border-bottom:1px solid rgba(255,255,255,0.1); }
            .cl-title { font-weight:700; font-size:12px; color:#fff; }
            .cl-content { flex:1; overflow:auto; padding:12px; color:#fff; }
            .btn { -webkit-app-region: no-drag; background: rgba(255, 255, 255, 0.16); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:4px 8px; border-radius:3px; font-size:12px; cursor:pointer; }
            .btn:hover { background: rgba(255,255,255,0.2); }
            .btn-danger { background: rgba(255,0,0,0.25); border-color: rgba(255,0,0,0.4); }
            .cl-section { background: rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.1); border-radius: 6px; margin-bottom: 12px; }
            .cl-section-header { display:flex; align-items:center; justify-content: space-between; padding: 10px 12px; border-bottom:1px solid rgba(255,255,255,0.08); }
            .cl-grid { padding: 10px; display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
            .cl-item { display:flex; align-items:center; gap:10px; background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:6px; padding:8px; cursor:pointer; }
            .cl-item:hover { background: rgba(255,255,255,0.1); }
            .cl-item input[type="checkbox"] { width:18px; height:18px; pointer-events:none; }
            .muted { color:#ccc; font-size: 12px; }
            .image { width:50px; height:50px; border-radius:6px; overflow:hidden; border:1px solid rgba(255,255,255,0.12); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#0d0d0d; }
            .cl-img { width:100%; height:100%; object-fit: cover; display:block; }
            /* Color variants (approximate to example) */
            .cl-item.red { background: rgba(255, 59, 48, 0.12); border-color: rgba(255, 59, 48, 0.35); }
            .cl-item.purple { background: rgba(156, 39, 176, 0.12); border-color: rgba(156, 39, 176, 0.35); }
            .cl-item.blue { background: rgba(33, 150, 243, 0.12); border-color: rgba(33, 150, 243, 0.35); }
            .cl-item.green { background: rgba(76, 175, 80, 0.12); border-color: rgba(76, 175, 80, 0.35); }
            .cl-item.pink { background: rgba(233, 30, 99, 0.12); border-color: rgba(233, 30, 99, 0.35); }
            .cl-item.yellow { background: rgba(255, 193, 7, 0.12); border-color: rgba(255, 193, 7, 0.35); }
            .cl-item.brown { background: rgba(121, 85, 72, 0.12); border-color: rgba(121, 85, 72, 0.35); }
            .cl-item.cyan { background: rgba(0, 188, 212, 0.12); border-color: rgba(0, 188, 212, 0.35); }
        </style>
    </head>
    <body>
        <div class="cl-container">
            <div class="cl-controls">
                <div class="cl-title">Checklist</div>
                <div style="display:flex; gap:8px; -webkit-app-region: no-drag;">
                    <button id="resetDaily" class="btn btn-danger" title="Uncheck all daily">Reset Daily</button>
                    <button id="resetWeekly" class="btn btn-danger" title="Uncheck all weekly">Reset Weekly</button>
                    <button id="closeChecklist" class="btn" title="Close">✕</button>
                </div>
            </div>
            <div class="cl-content">
            <div class="cl-section">
                <div class="cl-section-header">
                    <div style="font-weight:600;">Daily</div>
                    <div class="muted" id="dailyProgress">0 completed</div>
                </div>
                <div class="cl-grid" id="dailyGrid"></div>
            </div>

            <div class="cl-section">
                <div class="cl-section-header">
                    <div style="font-weight:600;">Weekly</div>
                    <div class="muted" id="weeklyProgress">0 completed</div>
                </div>
                <div class="cl-grid" id="weeklyGrid"></div>
            </div>
            </div>
        </div>
        <script src="checklist.js"></script>
    </body>
    </html>
