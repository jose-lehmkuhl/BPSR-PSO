<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BPCT</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    </head>
    <body>
        <div id="app-wrapper">
            <div class="main-container">
                <div class="controls">
                    <div class="title-container">
                        <span class="app-title">Blue Protocol Combat Tracker</span>
                    </div>
                    <div class="button-group">
                        <button id="modeMenuButton" title="Select View">🗡️</button>
                        <button id="clearButton" onclick="relaunchApp()" title="Refresh">🔄</button>
                        <button id="checklistButton" onclick="openChecklist()" title="Checklist">✅</button>
                        <button id="settingsButton" onclick="toggleSettings()" title="Settings">⚙️</button>
                        <button id="closeButton" onclick="closeClient()" title="Close">✕</button>
                        <span id="passthroughTitle" class="passthrough-title hidden"> Clickthrough Enabled </span>
                        <span id="fightTimer" style="margin-left:6px; color:#fff; font-size:10px; opacity:0.8;">00:00</span>
                    </div>
                </div>
                <!-- Mode dropdown -->
                <div id="modeMenu" class="mode-menu hidden">
                    <div class="mode-item" data-mode="dps">🗡️ DPS</div>
                    <div class="mode-item" data-mode="hps">✚ HPS</div>
                    <div class="mode-item" data-mode="tanking">🛡️ Tanking</div>
                    <div class="mode-item" data-mode="npc">💀 NPC</div>
                </div>
                <div id="columnsContainer" class="columns-container"></div>
                <div class="footer-toolbar" style="padding:6px 8px; display:flex; align-items:center; justify-content: space-between; gap:8px;">
                    <label for="encounterSelect" style="color:#fff; font-size:12px;">Encounter:</label>
                    <select id="encounterSelect" class="input" style="flex:1;">
                        <option value="current">Current encounter</option>
                    </select>
                </div>
                <div id="settingsContainer" class="settings-container hidden">
                    <div class="settings-option">
                        <label for="opacitySlider">Background Opacity</label>
                        <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.05" />
                    </div>
                    <div class="settings-option">
                        <label>Hotkeys</label>
                        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                            <div>
                                <div style="font-size:12px; color:#ccc;">Click-through</div>
                                <input id="hkClickthrough" type="text" value="F6" class="input" style="width:80px;" />
                            </div>
                            <div>
                                <div style="font-size:12px; color:#ccc;">Toggle Window</div>
                                <input id="hkToggleWindow" type="text" value="F7" class="input" style="width:80px;" />
                            </div>
                            <div>
                                <div style="font-size:12px; color:#ccc;">Refresh (Clear)</div>
                                <input id="hkClear" type="text" value="F5" class="input" style="width:80px;" />
                            </div>
                            <button id="saveHotkeysBtn" class="btn" style="margin-left:8px;">Save</button>
                        </div>
                    </div>
                    <div class="settings-option">
                        <label for="oocTimer">Clear data when out of combat (seconds)</label>
                        <input type="number" id="oocTimer" class="input" min="5" max="600" step="5" value="10" />
                        <button id="saveOocBtn" class="btn">Save</button>
                    </div>
                    <div class="settings-option">
                        <label>Logs</label>
                        <button id="deleteLogsBtn" class="btn" style="background: rgba(255,0,0,0.25); border-color: rgba(255,0,0,0.4);">Delete all logs</button>
                    </div>
                </div>
                <!-- Breakdown Modal -->
                <div id="breakdownModal" class="modal hidden">
                    <div class="modal-card">
                        <div class="modal-header">
                            <span id="breakdownTitle">Breakdown</span>
                            <button id="breakdownClose" class="btn">✕</button>
                        </div>
                        <div id="breakdownBody" class="modal-body"></div>
                    </div>
                </div>
                
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
