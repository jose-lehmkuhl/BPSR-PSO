<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BPSR-PSO</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    </head>
    <body>
        <div id="app-wrapper">
            <div class="main-container">
                <div class="controls">
                    <div class="title-container">
                        <div id="serverStatus" class="status-indicator"></div>
                        <span class="app-title">BPSR-PSO</span>
                    </div>
                    <div class="button-group">
                        <button id="clearButton" onclick="clearData()" title="Clear Data">Clear</button>
                        <button id="pauseButton" onclick="togglePause()" title="Pause/Resume">Pause</button>
                        
                        <button id="settingsButton" onclick="toggleSettings()" title="Settings">⚙️</button>
                        <button id="closeButton" onclick="closeClient()" title="Close Client">X</button>
                        <span id="passthroughTitle" class="passthrough-title hidden"> Clickthrough Enabled </span>
                    </div>
                </div>
                <div style="padding:6px 8px; display:flex; gap:8px; align-items:center; justify-content: space-between;">
                    <div style="display:flex; gap:6px; -webkit-app-region: no-drag;">
                        <button class="mode-btn" id="modeDpsBtn">DPS</button>
                        <button class="mode-btn" id="modeHpsBtn">HPS</button>
                        <button class="mode-btn" id="modeTankingBtn">Tanking</button>
                        <button class="mode-btn" id="modeNpcTankingBtn">NPC</button>
                    </div>
                    <div style="color:#fff; font-size:11px; opacity:0.85; min-width:80px; text-align:right;">
                        <span id="fightTimer">00:00</span>
                    </div>
                </div>
                <div id="columnsContainer" class="columns-container"></div>
                <div id="settingsContainer" class="settings-container hidden">
                    <div class="settings-option">
                        <label for="opacitySlider">Background Opacity</label>
                        <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.05" />
                    </div>
                    <div class="settings-option">
                        <label>Hotkeys</label>
                        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                            <div>
                                <div style="font-size:12px; color:#ccc;">Click-through</div>
                                <input id="hkClickthrough" type="text" value="F6" style="width:80px;" />
                            </div>
                            <div>
                                <div style="font-size:12px; color:#ccc;">Toggle Window</div>
                                <input id="hkToggleWindow" type="text" value="F7" style="width:80px;" />
                            </div>
                            <button id="saveHotkeysBtn" style="margin-left:8px;">Save</button>
                        </div>
                    </div>
                    <div class="settings-option">
                        <label for="oocTimer">Clear data when out of combat (seconds)</label>
                        <input type="number" id="oocTimer" min="5" max="600" step="5" value="15" />
                        <button id="saveOocBtn">Save</button>
                    </div>
                </div>
                
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
